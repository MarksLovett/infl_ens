# Routing ladder at the theory equilibrium: Hard k=1 (one categorical draw). Seed 0.
#
# One-factor contrast against its approximate-init counterpart in
# seven_axis_3arm. Starting positions are byte-identical to every other
# arm in the ladder (and to seven_axis_theory_eq), so only the routing
# rule moves. Same seed-0 split and test pool; the generalist is reused,
# NOT retrained.
#
#   python -m infl_ens.pipeline --config configs/experiments/seven_axis_theory_eq_hard_matched.yaml
name: seven_axis_theory_eq_hard_matched
results_dir: results/seven_axis_theory_eq_hard_matched
figures_dir: figures/seven_axis_theory_eq_hard_matched

arms:
  - name: theory_eq_hard_matched
    label: "Hard k=1 (one categorical draw)"
    title: "Hard k=1 (one categorical draw), started at the empirical-B equilibrium"
    role: specialist
    config: ../arms/soft_theory_eq_hard_matched_seed0.yaml
  - name: generalist
    label: "Pooled generalist"
    title: "Pooled generalist (existing seed-0 replay, not retrained)"
    role: generalist
    config: ../arms/generalist_replay.yaml

stages: [manifest, train, perround, routing, figures]
