# Double-seed replicate, data-split seed 2, phase2.
#
# Both the run seed and the data-split seed are set to 2, so this measures
# initialisation variance AND data variance together -- the bound a reviewer
# means by "error bars", unlike a run-seed-only replicate which only bounds
# retraining reproducibility.
#
# The test pool differs from the seed-0 work, so absolute NLL is not
# comparable across data seeds. Compare `learned - pooled`, `oracle - learned`
# and the intra/inter split, all of which are within-split contrasts.
#
# The generalist is trained at THIS data seed; sharing one across splits would
# score specialists against a baseline fitted to different data.
#
#   python -m infl_ens.pipeline --config configs/experiments/seven_axis_dseed2_phase2.yaml
name: seven_axis_dseed2_phase2
results_dir: results/seven_axis_dseed2_phase2
figures_dir: figures/seven_axis_dseed2_phase2

arms:
  - name: s06_d2
    label: "sigma 0.60 / dseed 2"
    title: "Fully distributed, sigma_fraction 0.60, both seeds 2"
    role: specialist
    config: ../arms/soft_full_sigma06_d2.yaml
  - name: s055_d2
    label: "sigma 0.55 / dseed 2"
    title: "Fully distributed, sigma_fraction 0.55, both seeds 2"
    role: specialist
    config: ../arms/soft_full_sigma055_d2.yaml
  - name: s04_d2
    label: "sigma 0.40 / dseed 2"
    title: "Fully distributed, sigma_fraction 0.40, both seeds 2"
    role: specialist
    config: ../arms/soft_full_sigma04_d2.yaml
  - name: s03_d2
    label: "sigma 0.30 / dseed 2"
    title: "Fully distributed, sigma_fraction 0.30, both seeds 2"
    role: specialist
    config: ../arms/soft_full_sigma03_d2.yaml
  - name: s01_d2
    label: "sigma 0.10 / dseed 2"
    title: "Fully distributed, sigma_fraction 0.10, both seeds 2"
    role: specialist
    config: ../arms/soft_full_sigma01_d2.yaml
  - name: s005_d2
    label: "sigma 0.05 / dseed 2"
    title: "Fully distributed, sigma_fraction 0.05, both seeds 2"
    role: specialist
    config: ../arms/soft_full_sigma005_d2.yaml
  - name: generalist
    label: "Pooled generalist (dseed 2)"
    title: "Pooled generalist, data-split seed 2"
    role: generalist
    config: ../arms/generalist_replay_dseed2.yaml

stages: [manifest, train, perround, routing, figures]

eval:
  perround_rounds: [4, final]
  perround_partition: val
  routing_partition: test
  max_eval_records: 1000

figures:
  axis_labels: [harm, hallucination, jailbreak, privacy, overrefusal, injection, policy]
  formats: [pdf, png]
  compile_tex: auto
  include:
    - arm_comparison
    - cross_arm_report

smoke:
  tests:
    - tests/test_soft_pairs.py
  arms: [s06_d2]
  output_root: results/_smoke_d2_phase2
  overrides:
    data_split: null
    eval: null
    closed_loop.n_rounds: 2
    closed_loop.batch_size: 64
    closed_loop.theory_gradient.n_steps: 500
