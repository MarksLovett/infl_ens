# Pooled baseline replay for the five-axis collapse closed loop.

task: baseline_replay
seed: 0
history_path: results/seven_axis_collapse_dead_axes/seed0/history.json
output_dir: results/seven_axis_collapse_dead_axes_baseline/seed0

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

trait_space:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  n_grid: 3
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.5

baseline_replay:
  agent_name: pooled-baseline
  save_per_round: true
  rounds: null

sft:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  output_dir: results/seven_axis_collapse_dead_axes_baseline/seed0/agents
  max_seq_length: 1024
  per_device_batch_size: 8
  gradient_accumulation_steps: 2
  num_train_epochs: 1.0
  learning_rate: 2.0e-4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  cumulative_lora: true
  seed: 0
