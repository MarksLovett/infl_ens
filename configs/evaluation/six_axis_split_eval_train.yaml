# Final-round eval on the train partition (cap 1000 per benchmark).

task: run_eval
seed: 0
output_dir: results/six_axis_pair_merge_split/seed0/eval_train
base_model: Qwen/Qwen2.5-1.5B-Instruct
run_dir: results/six_axis_pair_merge_split/seed0

agents: null
rounds: null

data_split:
  manifest: data/splits/six_axis_seed0.json
  partition: train

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: prompt_injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

eval:
  max_seq_length: 1024
  forward_batch_size: 8
  max_eval_records: 1000
