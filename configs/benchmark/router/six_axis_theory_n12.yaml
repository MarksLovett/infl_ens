# Theory-only Nash solve on the 6-axis safety trait space with 12 agents.
# Runs gradient ascent on router positions (no SFT) and writes positions.json.

task: router_training
seed: 0
output_dir: results/six_axis_theory_n12
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: prompt_injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  encoder_batch_size: 2
  cache: true
  cache_dir: data/trait_space_cache
  n_grid: 3
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.5
  mode_alignment_weights:
    harm: 1.0
    hallucination: 1.0
    privacy: 1.0
    overrefusal: 1.0
    injection: 1.0
    policy_violation: 1.0
  coordinate_stretch_gamma: 1.5
  coordinate_stretch_gammas:
    harm: 6.0
    hallucination: 2.5
    privacy: 2.5
    overrefusal: 2.5
    injection: 6.0
    policy_violation: 6.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3
  - name: clone-4
  - name: clone-5
  - name: clone-6
  - name: clone-7
  - name: clone-8
  - name: clone-9
  - name: clone-10
  - name: clone-11

sigma_mode: stability_fraction
sigma_fraction: 0.1

training:
  init_mode: theory_gradient_paired
  init_noise: 0.0
  theory_gradient:
    learning_rate: 2.5e-2
    n_steps: 8000
    tol: 1.0e-8
    min_pairwise: 0.2
  learning_rate: 0.025
  n_steps: 8000
  tol: 1.0e-8
  clip_to_box: true
