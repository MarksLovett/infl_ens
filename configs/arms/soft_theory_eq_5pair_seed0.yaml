# Training from the theory equilibrium, seed 0.
#
# One factor moves against seven_axis_5pair_sigma05/seed0: where the
# clones start. Everything else -- split, absolute sigma, twelve rounds,
# fully dense soft routing, loss weighting -- is identical, so the two
# arms share a test pool and the existing seed-0 generalist is still
# data-matched and is NOT retrained.
#
# The positions below are an equilibrium of the influencer game solved
# against the empirical prompt cloud (28355 prompts, uniform
# weight) rather than against the lattice KDE. That solve is CPU-only;
# see paper/true_theory_positions.py. Pinning the result here keeps it
# in the resolved config instead of being recomputed per run.
#
#   sigma (absolute)      0.201055
#   sigma_0* lattice      0.402110   (what the runs quote against)
#   sigma_0* empirical    0.362154
#   pairs                 5  (10 clones, co-located)
#   grad-norm at start    3.186e-09   (polished from 5.597e-03 in 142 fixed-point iterations)

includes:
  - _closed_loop_base.yaml

output_dir: results/seven_axis_theory_eq_5pair/seed0

sigma_fraction: 0.50

# An explicit list replaces the base's `agents: {pairs_from_axes: true}`
# mapping, which always expands to N = 2L = 14 regardless of pair count.
# This arm needs N = 10, one clone pair per routing pair.
agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3
  - name: clone-4
  - name: clone-5
  - name: clone-6
  - name: clone-7
  - name: clone-8
  - name: clone-9

closed_loop:
  routing_mode: soft
  soft_top_k: 5                     # == number of pairs: fully dense
  soft_loss: weighted
  init_mode: given
  init_noise: 0.0
  init_positions_source: >-
    influencer-game equilibrium under the empirical prompt measure,
    solved offline from seven_axis_5pair_sigma05/seed0 settings

  # Clone 2i and 2i+1 share pair i's position. Co-location is a fixed
  # point of the update, so the pairs stay merged without being forced.
  init_positions:
    clone-0: [0.4560524858, 0.3172927739, 0.4399726610, 0.2226605366, 0.1939752633, 0.8751635344, 0.4945590945]
    clone-1: [0.4560524858, 0.3172927739, 0.4399726610, 0.2226605366, 0.1939752633, 0.8751635344, 0.4945590945]
    clone-2: [0.5692200548, 0.3277870656, 0.4220232811, 0.5803794284, 0.5764767866, 0.3704927984, 0.3066122994]
    clone-3: [0.5692200548, 0.3277870656, 0.4220232811, 0.5803794284, 0.5764767866, 0.3704927984, 0.3066122994]
    clone-4: [0.6541357495, 0.6238520938, 0.5391353712, 0.6840756345, 0.6981060926, 0.6241549237, 0.6448173238]
    clone-5: [0.6541357495, 0.6238520938, 0.5391353712, 0.6840756345, 0.6981060926, 0.6241549237, 0.6448173238]
    clone-6: [0.3445666437, 0.4137977069, 0.4759899734, 0.2359762196, 0.2991143511, 0.1369366852, 0.8084974131]
    clone-7: [0.3445666437, 0.4137977069, 0.4759899734, 0.2359762196, 0.2991143511, 0.1369366852, 0.8084974131]
    clone-8: [0.2978657202, 0.8039069566, 0.6253819398, 0.5861345980, 0.5599631005, 0.4703518077, 0.2794872455]
    clone-9: [0.2978657202, 0.8039069566, 0.6253819398, 0.5861345980, 0.5599631005, 0.4703518077, 0.2794872455]

  # Pinned to match the co-location above, since no solve runs to infer it.
  sft_merge_groups:
    - train_as: pair-0
      names: [clone-0, clone-1]
    - train_as: pair-1
      names: [clone-2, clone-3]
    - train_as: pair-2
      names: [clone-4, clone-5]
    - train_as: pair-3
      names: [clone-6, clone-7]
    - train_as: pair-4
      names: [clone-8, clone-9]
