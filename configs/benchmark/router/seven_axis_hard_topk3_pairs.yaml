# ARM 1d — seven-axis "HARD TOP-3": sample 3 winning pairs per prompt WITHOUT
# replacement, then train each at unit weight.
#
# This is hard routing generalised past a single winner. Ordinary hard routing
# draws ONE pair per prompt from the categorical distribution G_p; this arm
# draws THREE distinct pairs by successive sampling — draw one with
# probability G_p, remove it, renormalise, draw again, three times. It is
# implemented with the Gumbel-top-k trick, which is exactly equivalent to that
# sequential procedure (see
# infl_ens.inflgame.router.allocation.sampled_top_k_mask), and at
# `soft_top_k: 1` it reduces precisely to the existing hard arm.
#
# It uses the soft machinery only as plumbing (multiple units per prompt, unit
# loss, dense position step); the SELECTION is stochastic, not argmax:
#
#   arm                                   selection            k   loss weight
#   seven_axis_soft_full_pairs.yaml       deterministic (all)  7   proportional
#   seven_axis_soft_topk3_pairs.yaml      deterministic top-3  3   proportional
#   seven_axis_topk3_unit_pairs.yaml      deterministic top-3  3   unit
#   THIS FILE                             SAMPLED w/o repl.    3   unit
#   seven_axis_hard_pairs_matched.yaml    sampled              1   unit
#
# The comparison this arm unlocks:
#   THIS vs seven_axis_topk3_unit_pairs  -> argmax vs sampling, at fixed k=3
#                                           and fixed unit weight. Nothing
#                                           else in the set isolates that.
#   THIS vs seven_axis_hard_pairs_matched -> k=3 vs k=1, both sampled, both
#                                           unit weight.
#
# Sampling explores past the three highest shares, so a pair with a modest
# share on a prompt still occasionally trains on it. That is the tail coverage
# the deterministic gate can never provide, and the reason the two need not
# converge to the same specialists.
#
# The `benchmarks:` and `trait_space:` blocks are copied verbatim from
# seven_axis_soft_pairs.yaml so the trait-space cache fingerprint
# (3b42c68a8dd334c5, Qwen3-Embedding-8B-AWQ) is reused. DO NOT EDIT THEM.

task: closed_loop
seed: 0
output_dir: results/seven_axis_hard_topk3_pairs/seed0
policy: proportional

data_split:
  seed: 0
  train_frac: 0.7
  val_frac: 0.1
  test_frac: 0.2
  manifest: data/splits/seven_axis_soft_seed0.json
  cover_train_exactly: true
  target_n_rounds: 12
  preferred_batch_sizes: [4900, 2450, 1225, 980, 700, 350]
  min_rounds: 5
  max_rounds: 50

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: jbb_behaviors
    path: data/jbb_behaviors
    include_benign: true
    max_records: null
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: prompt_injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  encoder_batch_size: 32
  cache: true
  cache_dir: data/trait_space_cache
  n_grid: 3
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.35
  mode_alignment_weights:
    jailbreak: 1.0
    privacy: 1.0
    overrefusal: 1.0
    injection: 1.0
    policy_violation: 1.0
  coordinate_stretch_gamma: 1.0

agents:
  pairs_from_axes: true
  name_prefix: clone

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  init_mode: theory_gradient_paired
  init_noise: 0.0
  theory_gradient:
    learning_rate: 2.0e-2
    n_steps: 8000
    tol: 1.0e-8
    min_pairwise: 0.2
    pairing: nearest
  snap_collapsed_pairs: true
  collapse_merge_threshold: 0.01

  routing_mode: soft
  soft_top_k: 3
  soft_select: sample    # <- draw 3 distinct pairs w/o replacement from G_p
  soft_loss: unit        # each drawn pair trains at unit weight, as in hard
  routing_weight: G
  loss_reweight: null
  position_update: theory_matched
  centroid_mode: batch
  blend: 0.5

  sft_merge_groups: from_init
  merge_group_prefix: pair
  save_per_round: true

  val_eval:
    every_n_rounds: 0

  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/seven_axis_hard_topk3_pairs/seed0/agents
    max_seq_length: 1024
    per_device_batch_size: 8
    gradient_accumulation_steps: 2
    num_train_epochs: 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    cumulative_lora: true
    seed: 0

eval:
  partitions: [train, test]
  rounds: final
  agents: null
  max_eval_records: 1000
  forward_batch_size: 8
  max_seq_length: null
  after_training: true
  baseline_run_dir: null
