name: docs

# Build the Sphinx site on every push to ``main`` (and on manual
# dispatch) and publish it to GitHub Pages via the modern Pages
# deployment API (``actions/upload-pages-artifact`` +
# ``actions/deploy-pages``). No ``gh-pages`` branch needed.
#
# Required one-time repository setup:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "README.md"
      - "structure.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; in-progress builds finish so we don't
# publish a half-rendered site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build HTML
        # ``-W --keep-going`` turns warnings into errors but still runs
        # through to surface every problem in one go. Loosen if the
        # repo intentionally ships warnings.
        run: |
          sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Disable Jekyll on Pages
        # Without ``.nojekyll`` GitHub Pages skips files/directories
        # whose names start with an underscore (``_static``,
        # ``_sources``, ...), which breaks Sphinx output.
        run: touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
