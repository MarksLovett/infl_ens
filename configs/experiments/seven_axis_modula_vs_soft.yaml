# Game arms vs the MoDULA-Res baseline: the fully distributed soft arm
# (k=7, the headline comparison), the top-3 soft arm, their pooled
# generalist, and the MoDULA-Res label baseline. Same arm configs as
# seven_axis_3arm.yaml, so it reads and writes the same results/
# directories; a subset of that experiment that can be trained and
# rendered on its own.
#
#   python -m infl_ens.pipeline --config configs/experiments/seven_axis_modula_vs_soft.yaml
#   python -m infl_ens.figures  --config configs/experiments/seven_axis_modula_vs_soft.yaml
name: seven_axis_modula_vs_soft
results_dir: results/seven_axis_modula_vs_soft
figures_dir: figures/seven_axis_modula_vs_soft

arms:
  - name: soft_full
    label: "Soft k=7 wtd"
    title: "Soft fully distributed (k=7)"
    role: specialist
    config: ../arms/soft_full_pairs.yaml
  - name: soft
    label: "Soft k=3 wtd"
    title: "Soft top-3 pairs"
    role: specialist
    config: ../arms/soft_topk3_pairs.yaml
  - name: generalist
    label: "Pooled generalist"
    title: "Pooled generalist"
    role: generalist
    config: ../arms/generalist_replay.yaml
  - name: modula_res
    label: "MoDULA-Res (labels)"
    title: "MoDULA-Res-style: universal + residual per-benchmark LoRAs"
    role: baseline
    config: ../arms/modula_res_labels.yaml

stages: [manifest, train, perround, routing, figures]

eval:
  perround_rounds: [4, final]
  perround_partition: val
  routing_partition: test
  max_eval_records: 1000
  fitted_router: true

figures:
  axis_labels: [harm, hallucination, jailbreak, privacy, overrefusal, injection, policy]
  formats: [pdf, png]
  compile_tex: auto
  include:
    - oracle_routing
    - arm_comparison
    - pair_positions
    - within_pair
    - cross_arm_report
    - closed_loop_history
    - per_round_tables

smoke:
  tests:
    - tests/test_soft_pairs.py
    - tests/test_topk_matched.py
