# Everything the `modula_res` baseline arms share. An arm file includes this
# and sets only `output_dir`, `modula_res.domain_source`,
# `modula_res.universal_run_dir` and `sft.lora_r`.
#
# The task replays the round schedule of the soft top-3 run (ARM 1): each
# round's batch is split into per-domain batches (by benchmark label or by
# the game's logged pair assignment) and one cumulative LoRA expert per
# domain is trained on them. Positions are copied from the source run, so
# route-then-score uses the game router unchanged. Runs AFTER ARM 1 and the
# generalist, since it reads their history.json / adapters.
includes:
  - ../data/seven_axis_safety.yaml
  - ../trait_space/seven_axis.yaml
  - ../models/qwen2_5_1_5b_instruct.yaml

task: modula_res
seed: 0
history_path: results/seven_axis_soft_topk3_pairs/seed0/history.json

modula_res:
  universal_agent: pooled-baseline   # adapter name inside universal_run_dir
  universal_round: final             # or an explicit round index
  save_per_round: true               # per-round experts feed the per-round NLL table
  rounds: null                       # replay every logged round

# Final-round held-out NLL, run automatically when training finishes.
# The eval stages merge `modula_res.universal_adapter_dir` (written by the
# task into resolved_config.yaml) under every expert when it is set.
eval:
  partitions: [train, test]
  rounds: final
  agents: null                      # discovers agents/<expert>/round-NN
  max_eval_records: 1000            # per benchmark
  forward_batch_size: 8
  max_seq_length: null              # defaults to sft.max_seq_length
  after_training: true
  baseline_run_dir: results/seven_axis_3arm_generalist/seed0
