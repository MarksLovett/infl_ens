# Sigma x seed grid: ten sigma values at three seeds each.
#
# The ten-point seed-0 sweep showed a plateau in `Learned - Pooled` that is not
# flat -- sigma 0.20 gains 0.0916 while its neighbours gain ~0.070, and sigma
# 0.45 dips to 0.0612. Adjacent sigma values should not swing that far.
#
# A four-seed probe of the theory init at sigma 0.5 showed why that is
# suspect: the equilibrium RADIUS is seed-invariant to 0.5%, but which axis
# each pair occupies is not, and different seeds orphan different axes. Every
# arm in the seed-0 sweep ran seed 0 at a different sigma, so each sampled a
# different basin -- the sigma effect and the basin effect are confounded.
#
# This grid runs seeds 1 and 2 alongside the existing seed 0 for all ten sigma
# values. `train` skips the ten seed-0 arms, so only 20 arms train.
#
# One generalist serves the whole grid: `data_split.seed` is pinned to 0 in
# configs/data/seven_axis_safety.yaml and takes precedence over the run seed,
# so every arm draws the identical round batches regardless of its seed.
#
#   python -m infl_ens.pipeline --config configs/experiments/seven_axis_sigma_seeds.yaml
name: seven_axis_sigma_seeds
results_dir: results/seven_axis_sigma_seeds
figures_dir: figures/seven_axis_sigma_seeds

arms:
  - name: s07_seed0
    label: "sigma 0.70 / seed 0"
    title: "Fully distributed, sigma_fraction 0.70, seed 0"
    role: specialist
    config: ../arms/soft_full_sigma07.yaml
  - name: s07_seed1
