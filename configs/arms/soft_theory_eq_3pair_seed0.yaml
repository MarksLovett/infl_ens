# Training from the theory equilibrium, seed 0.
#
# One factor moves against seven_axis_3pair_sigma05/seed0: where the
# clones start. Everything else -- split, absolute sigma, twelve rounds,
# fully dense soft routing, loss weighting -- is identical, so the two
# arms share a test pool and the existing seed-0 generalist is still
# data-matched and is NOT retrained.
#
# The positions below are an equilibrium of the influencer game solved
# against the empirical prompt cloud (28355 prompts, uniform
# weight) rather than against the lattice KDE. That solve is CPU-only;
# see paper/true_theory_positions.py. Pinning the result here keeps it
# in the resolved config instead of being recomputed per run.
#
#   sigma (absolute)      0.190737
#   sigma_0* lattice      0.381475   (what the runs quote against)
#   sigma_0* empirical    0.343570
#   pairs                 3  (6 clones, co-located)
#   grad-norm at start    1.648e-08   (polished from 1.916e-02 in 137 fixed-point iterations)

includes:
  - _closed_loop_base.yaml

output_dir: results/seven_axis_theory_eq_3pair/seed0

sigma_fraction: 0.50

# An explicit list replaces the base's `agents: {pairs_from_axes: true}`
# mapping, which always expands to N = 2L = 14 regardless of pair count.
# This arm needs N = 6, one clone pair per routing pair.
agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3
  - name: clone-4
  - name: clone-5

closed_loop:
  routing_mode: soft
  soft_top_k: 3                     # == number of pairs: fully dense
  soft_loss: weighted
  init_mode: given
  init_noise: 0.0
  init_positions_source: >-
    influencer-game equilibrium under the empirical prompt measure,
    solved offline from seven_axis_3pair_sigma05/seed0 settings

  # Clone 2i and 2i+1 share pair i's position. Co-location is a fixed
  # point of the update, so the pairs stay merged without being forced.
  init_positions:
    clone-0: [0.4139114979, 0.3462496325, 0.4479403687, 0.2227386191, 0.2348244680, 0.4880000280, 0.6125073727]
    clone-1: [0.4139114979, 0.3462496325, 0.4479403687, 0.2227386191, 0.2348244680, 0.4880000280, 0.6125073727]
    clone-2: [0.4336247530, 0.5074185093, 0.5015675603, 0.5744747870, 0.5695092987, 0.3961574644, 0.2758347159]
    clone-3: [0.4336247530, 0.5074185093, 0.5015675603, 0.5744747870, 0.5695092987, 0.3961574644, 0.2758347159]
    clone-4: [0.6284361409, 0.6312692539, 0.5367406675, 0.6636647338, 0.6666526434, 0.6038268357, 0.6212592405]
    clone-5: [0.6284361409, 0.6312692539, 0.5367406675, 0.6636647338, 0.6666526434, 0.6038268357, 0.6212592405]

  # Pinned to match the co-location above, since no solve runs to infer it.
  sft_merge_groups:
    - train_as: pair-0
      names: [clone-0, clone-1]
    - train_as: pair-1
      names: [clone-2, clone-3]
    - train_as: pair-2
      names: [clone-4, clone-5]
