# REPLICATE 3: fully distributed soft routing (k = 7, share-weighted) at
# sigma_fraction = 0.05, run seed 3 AND data-split seed 3.
#
# Both seeds move together, so this measures initialisation variance and data
# variance jointly -- the bound that supports a generalisation claim, unlike a
# run-seed-only replicate which only bounds retraining reproducibility.
#
# Absolute NLL is NOT comparable across data seeds (each has its own test
# pool). Compare within-split contrasts: learned - pooled, oracle - learned,
# and the intra/inter split.
includes:
  - _closed_loop_base.yaml

output_dir: results/seven_axis_sigma005_full/dseed3

seed: 3
sigma_fraction: 0.05

data_split:
  seed: 3
  manifest: data/splits/seven_axis_soft_dseed3.json

closed_loop:
  routing_mode: soft
  soft_top_k: 7                     # == number of pairs: fully dense
  soft_loss: weighted
