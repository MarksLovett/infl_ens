# Five-axis collapse from hypercube-edge GA positions.
#
# - Start: results/hypercube_edge_gradient_ascent/fixed_positions.json
# - theory_pre: 24 matched-pool adaptive steps (position only, no SFT)
# - routing_weight=G, loss_reweight=position_only, centroid_mode=expected_pool
# - sft_merge_groups: SFT-only merge for GA-collapsed axis pairs
#   (10 independent routers for routing + per-clone position updates)
#
# Gate: flat test-pool route-then-score (expected G) vs pooled baseline.

task: closed_loop
seed: 0
output_dir: results/seven_axis_collapse_hypercube_ga/seed0
policy: proportional

data_split:
  seed: 0
  train_frac: 0.7
  val_frac: 0.1
  test_frac: 0.2
  manifest: data/splits/five_axis_seed0.json
  cover_train_exactly: true
  preferred_batch_sizes: [3500, 2450, 1225, 980, 700, 350]
  min_rounds: 5
  max_rounds: 50

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  encoder_batch_size: 2
  cache: true
  cache_dir: data/trait_space_cache
  n_grid: 3
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.5
  mode_alignment_weights:
    harm: 1.0
    hallucination: 1.0
    privacy: 1.0
    overrefusal: 1.0
    policy_violation: 1.0
  coordinate_stretch_gamma: 1.5
  coordinate_stretch_gammas:
    harm: 2.5
    hallucination: 2.5
    privacy: 2.5
    overrefusal: 2.5
    policy_violation: 6.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3
  - name: clone-4
  - name: clone-5
  - name: clone-6
  - name: clone-7
  - name: clone-8
  - name: clone-9

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  blend: 0.5
  init_noise: 0.0
  init_mode: fixed_positions
  fixed_positions: results/hypercube_edge_gradient_ascent/fixed_positions.json
  snap_collapsed_pairs: true
  collapse_merge_threshold: 0.01
  sft_merge_only_if_collapsed: true
  theory_pre:
    enabled: true
    n_rounds: 24
    blend: 0.5
    position_step:
      mode: cap_linf
      step_cap: 0.05
  position_step:
    mode: cap_linf
    step_cap: 0.05
  centroid_mode: expected_pool
  routing_weight: G
  loss_reweight: position_only
  save_per_round: true
  sft_merge_groups:
    - train_as: merge-harm
      names: [clone-0, clone-1]
    - train_as: merge-hallucination
      names: [clone-2, clone-3]
    - train_as: merge-privacy
      names: [clone-4, clone-5]
    - train_as: merge-overrefusal
      names: [clone-6, clone-7]
    - train_as: merge-policy
      names: [clone-8, clone-9]
  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/seven_axis_collapse_hypercube_ga/seed0/agents
    max_seq_length: 1024
    per_device_batch_size: 8
    gradient_accumulation_steps: 2
    num_train_epochs: 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    cumulative_lora: true
    seed: 0
