# Router-position training on the 3-D benchmark trait space:
# BeaverTails harm, HaluEval hallucination, and ToxicChat jailbreak intent.

task: router_training
seed: 0
output_dir: results/safety_truth_toxicchat_n4
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: jbb_behaviors
    path: data/jbb_behaviors
    include_benign: true
    max_records: null

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  # 24^3 keeps the 3-D grid light enough for fast router sweeps and heatmaps.
  n_grid: 24
  kde_bandwidth: 0.08
  threshold: 0.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3

sigma_mode: stability_fraction
sigma_fraction: 0.5

training:
  init_noise: 0.01
  learning_rate: 0.005
  n_steps: 5000
  tol: 1.0e-8
  clip_to_box: true
