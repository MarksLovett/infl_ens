# Shared seven-pair theory equilibrium (N = 14 clones, sigma_fraction 0.50).
#
# Lifted verbatim from soft_theory_eq_seed0.yaml so every arm that includes
# this file starts from the SAME equilibrium. That is what makes routing,
# allocation and position-update comparisons one-factor.
#
# This is an equilibrium of the influencer game solved against the empirical
# prompt cloud, NOT the lattice KDE, and NOT the 8000-step approximate solve
# that `init_mode: theory_gradient_paired` runs. For N = 14 that approximate
# solve does not converge -- it caps out at its step limit -- so its endpoint
# depends on the step count. This one is converged.
#
#   sigma (absolute)      0.204885
#   sigma_0* lattice      0.409770
#   sigma_0* empirical    0.369053
#   grad-norm at start    3.112e-09
#   positions sha256_16   be21721a9ab5c9b2
#
# Underscore-prefixed: this is an include fragment, not a runnable arm, and
# tests/test_config_fingerprint.py skips `_`-prefixed files by design.

closed_loop:
  init_mode: given
  init_noise: 0.0
  init_positions_source: >-
    influencer-game equilibrium under the empirical prompt measure;
    identical to seven_axis_theory_eq/seed0

