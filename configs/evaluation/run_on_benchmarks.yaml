# Evaluate every adapter under a closed-loop run on both benchmarks.
#
#   python -m infl_ens.evaluation --config configs/evaluation/run_on_benchmarks.yaml \
#       -- run_dir=results/safety_truth_n4_r10_strategic

task: run_eval
seed: 0
output_dir: results/eval_run_smoke
base_model: Qwen/Qwen2.5-1.5B-Instruct
run_dir: results/CHANGE_ME

# Optional filters (null = all discovered agents / rounds)
agents: null
rounds: null

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: null
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: null

eval:
  max_seq_length: 1024
  forward_batch_size: 8
  max_eval_records: 128
