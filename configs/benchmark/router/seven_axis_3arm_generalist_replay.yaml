# ARM 3 of 3 — pooled GENERALIST for the seven-axis three-arm comparison.
#
# One cumulative LoRA trained on the union of the routed batches logged by ARM 1
# (seven_axis_soft_topk3_pairs). Soft rounds with soft_top_k > 1 are
# de-duplicated back to the underlying round batch, so the generalist sees each
# source example exactly once per round — the data-matched comparator for the
# specialists.
#
# It is matched to ARM 2 as well. Both arms use the same split manifest, the
# same seed and the same initialization, so `shuffled_train_batch_indices`
# hands them identical round batches; the de-duplicated soft batch and the
# concatenated (disjoint) hard batches are therefore the same set of prompts
# per round. `scripts/run_seven_axis_3arm_analysis.sh` asserts this before
# using one generalist for both comparisons, and falls back to a second replay
# if the check fails.
#
# The agent name MUST stay `pooled-baseline`: the oracle / route-then-score
# evaluator loads the generalist from
# `<baseline_run_dir>/agents/pooled-baseline/round-NN`
# (infl_ens.evaluation.routing_eval.score_pooled_nll, hardcoded).
#
# Run AFTER ARM 1 has finished (it reads that run's history.json).
#
# Launch:
#   ARM=seven_axis_3arm_generalist GPU=0 \
#   CONFIG=configs/benchmark/router/seven_axis_3arm_generalist_replay.yaml \
#   REMOTE=mslovett@doob.dartmouth.edu bash scripts/run_soft_pairs_on_doob.sh

task: baseline_replay
seed: 0
history_path: results/seven_axis_soft_topk3_pairs/seed0/history.json
output_dir: results/seven_axis_3arm_generalist/seed0

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: jbb_behaviors
    path: data/jbb_behaviors
    include_benign: true
    max_records: null
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: prompt_injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

# Kept identical to the specialist arms so the cached projector is reused.
trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  encoder_batch_size: 32
  cache: true
  cache_dir: data/trait_space_cache
  n_grid: 3
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.35
  mode_alignment_weights:
    jailbreak: 1.0
    privacy: 1.0
    overrefusal: 1.0
    injection: 1.0
    policy_violation: 1.0
  coordinate_stretch_gamma: 1.0

baseline_replay:
  agent_name: pooled-baseline   # hardcoded name expected by routing_eval
  save_per_round: true
  rounds: null

sft:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  output_dir: results/seven_axis_3arm_generalist/seed0/agents
  max_seq_length: 1024
  per_device_batch_size: 8
  gradient_accumulation_steps: 2
  num_train_epochs: 1.0
  learning_rate: 2.0e-4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  cumulative_lora: true
  seed: 0
