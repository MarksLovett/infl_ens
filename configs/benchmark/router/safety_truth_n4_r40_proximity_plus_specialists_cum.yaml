# Proximity merge + per-clone specialists in ONE run, same init as pairs_near_eq.
#
# Matches pairs_near_eq: theory_gradient, expected_pool, position_only, batch 256.
# Trains both merge-* LoRAs (proximity pairing) and clone-* LoRAs each round
# for apples-to-apples benchmark comparison.

task: closed_loop
seed: 0
output_dir: results/safety_truth_n4_r40_proximity_plus_specialists_cum
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000

trait_space:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  n_grid: 32
  kde_bandwidth: 0.08
  threshold: 0.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  n_rounds: 40
  batch_size: 256
  blend: 0.5
  init_noise: 0.0
  init_mode: theory_gradient
  centroid_mode: expected_pool
  routing_weight: G
  loss_reweight: position_only
  save_per_round: true
  sft_merge_mode: proximity
  sft_also_train_individual: true
  merge_distance_threshold: 0.08
  merge_layout_spread_thresh: 0.45
  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/safety_truth_n4_r40_proximity_plus_specialists_cum/agents
    max_seq_length: 1024
    per_device_batch_size: 8
    gradient_accumulation_steps: 2
    num_train_epochs: 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    cumulative_lora: true
    seed: 0
