name: docs

# Build the Sphinx site on every push to ``main`` (and on manual
# dispatch) and publish it to GitHub Pages via the modern Pages
# deployment API (``actions/upload-pages-artifact`` +
# ``actions/deploy-pages``). No ``gh-pages`` branch needed.
#
# Required one-time repository setup:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "infl_ens/**"
      - "docs/**"
      - "README.md"
      - "structure.md"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Show repo layout (diagnostic)
        # Surfaces the actual on-disk layout the doc build sees.
        run: |
          echo "::group::Top-level"
          ls -la
          echo "::endgroup::"
          echo "::group::src/ tree (3 levels deep, with __init__.py markers)"
          if [ -d src ]; then
            find src -maxdepth 4 \( -type d -o -name '__init__.py' -o -name '*.py' \) | sort
          else
            echo "no src/ directory"
          fi
          echo "::endgroup::"
          echo "::group::infl_ens/ at repo root (if flat layout)"
          [ -d infl_ens ] && find infl_ens -maxdepth 3 -type d | sort || echo "no flat infl_ens/ directory"
          echo "::endgroup::"

      - name: Ensure docs include targets exist
        # ``docs/getting_started.rst`` and ``docs/structure.rst`` use
        # MyST ``.. include::`` to embed ``README.md`` and
        # ``structure.md`` from the repo root. If either file is
        # missing on the branch being built, the Sphinx build aborts.
        # Write a workspace-only placeholder so the docs always build;
        # this does NOT commit anything back to the repo, it just keeps
        # the include directive happy. When the real file exists, it
        # wins and no placeholder is written.
        #
        # Placeholder content is intentionally link-free: any Markdown
        # link to a Sphinx doc path (e.g. ``[text](api/data.html)``)
        # triggers a ``myst.xref_missing`` warning at build time, which
        # is suppressed but still noisy in logs.
        run: |
          if [ ! -f README.md ]; then
            cat > README.md <<'EOF'
          # infl_ens

          *(Placeholder generated by `docs.yml`. Commit a real
          `README.md` at the repo root to replace this content.)*

          Influencer-game router and learning algorithms for small
          language models. Browse the navigation sidebar for the API
          reference and repository structure.
          EOF
            echo "::warning::README.md is missing from the repo root; wrote a placeholder for the docs build only."
          fi
          if [ ! -f structure.md ]; then
            cat > structure.md <<'EOF'
          # structure.md

          *(Placeholder generated by `docs.yml`. Commit the real
          `structure.md` at the repo root to replace this content.)*
          EOF
            echo "::warning::structure.md is missing from the repo root; wrote a placeholder for the docs build only."
          fi

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Install the package (if pyproject.toml or setup.py exists)
        # If the repo is pip-installable, do it so autodoc can find
        # ``infl_ens`` regardless of layout quirks AND so that
        # ``pyproject.toml``'s declared runtime dependencies (e.g.
        # numpy) end up installed. If neither file exists this step is
        # a no-op and the build falls back to:
        #
        # - the ``sys.path`` insertion in ``docs/conf.py`` (for finding
        #   the package), and
        # - the explicit ``numpy`` entry in ``docs/requirements.txt``
        #   (for the one runtime dep autodoc actually needs).
        #
        # A broken ``pyproject.toml`` fails here with a clear pip
        # error rather than later inside autosummary.
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "Installing package in editable mode..."
            pip install -e .
          else
            echo "No pyproject.toml / setup.py; relying on PYTHONPATH + conf.py sys.path."
          fi

      - name: Preflight import (surface the real error)
        # Sphinx's autosummary wraps ImportError and re-raises with a
        # synthetic ``"no module named X"`` message that throws away
        # the original traceback. This step imports each subpackage
        # directly so a clean Python traceback shows up in the build
        # log if anything is wrong (missing __init__.py, syntax error,
        # unmocked top-level import in a leaf module, ...).
        #
        # The MagicMock shim mirrors the pre-emptive mocking that
        # ``docs/conf.py`` performs, so this step's pass/fail signal
        # matches what Sphinx itself will experience.
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          python <<'PY'
          import sys
          from unittest.mock import MagicMock
          MOCKS = [
              "torch", "torch.nn", "torch.nn.functional",
              "transformers", "datasets", "peft", "trl", "accelerate",
              "bitsandbytes", "sentence_transformers", "huggingface_hub",
              "sklearn", "scipy", "matplotlib", "matplotlib.pyplot",
              "pandas", "yaml", "hydra", "omegaconf", "tqdm",
          ]
          for m in MOCKS:
              sys.modules.setdefault(m, MagicMock())

          subs = [
              "infl_ens",
              "infl_ens.data",
              "infl_ens.data.benchmarks",
              "infl_ens.inflgame",
              "infl_ens.inflgame.router",
              "infl_ens.training",
              "infl_ens.utils",
          ]
          failed = False
          for name in subs:
              try:
                  mod = __import__(name, fromlist=["_"])
                  print(f"  OK   {name:32s} -> {getattr(mod, '__file__', '<namespace>')}")
              except Exception:
                  print(f"  FAIL {name}")
                  import traceback
                  traceback.print_exc()
                  failed = True
                  break
          if failed:
              # Hard-fail this step so the user sees a red X next to
              # "Preflight import" rather than a confusing autosummary
              # error in a later step.
              sys.exit(1)
          PY

      - name: Build HTML
        # ``-W --keep-going`` turns warnings into errors but still
        # surfaces every problem in one go. ``-v`` produces more
        # detailed logs so internal exceptions (which Sphinx normally
        # swallows) become visible.
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          sphinx-build -b html -v -W --keep-going docs docs/_build/html

      - name: Disable Jekyll on Pages
        # Without ``.nojekyll`` GitHub Pages skips files/directories
        # whose names start with an underscore (``_static``,
        # ``_sources``, ...), which breaks Sphinx output.
        run: touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
