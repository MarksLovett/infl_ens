# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------
# Hatchling is the PyPA-recommended modern backend and handles ``src/``
# layouts cleanly without a ``setup.py`` shim. Swap to setuptools if your
# CI environment requires it; the rest of this file is backend-agnostic.
[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"


# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "infl_ens"
version = "0.1.0"
description = "Influencer-game router and learning algorithms for small language models."
# ``readme`` is intentionally not declared here. Hatchling validates
# this field at metadata-generation time and aborts the install if the
# referenced file is missing, which makes the build brittle in CI when
# a branch hasn't committed a README yet. Once ``README.md`` is a
# stable repo-root file, re-enable with:
#
#     readme = "README.md"
#
# or (preferred) the explicit form:
#
#     readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "infl_ens contributors" },
]
keywords = [
    "influencer-game",
    "LLM-alignment",
    "Nash-equilibrium",
    "game-theory",
    "router",
    "LoRA",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime dependencies are intentionally minimal: the analytical
# pieces (allocation math, router, trait-space construction, utils) only
# need numpy. Everything heavier is opt-in via extras below — this
# matches the deferred-import pattern used throughout the package and
# keeps ``import infl_ens`` cheap.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Heavy ML stack — required for the SFT trainer and the sentence-
# transformer encoders. Triggered by:
#   pip install "infl_ens[ml]"
ml = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
    "peft>=0.10",
    "trl>=0.8",
    "accelerate>=0.30",
    "sentence-transformers>=2.6",
    "huggingface-hub>=0.22",
]

# Numerical + tabular extras used by the analysis scripts under
# ``scripts/`` (sweeps, equilibrium classification, capability probes).
data = [
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

# Plotting — keep separate from ``data`` so headless CI installs stay slim.
vis = [
    "matplotlib>=3.7",
]

# Config loading + sweep helpers (Hydra/OmegaConf optional; PyYAML covers
# the minimum needed by ``python -m infl_ens.training --config``).
configs = [
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.65",
]

# Documentation toolchain — kept in sync with ``docs/requirements.txt``.
docs = [
    "sphinx>=7.3,<9",
    "furo>=2024.5.6",
    "myst-parser>=2.0,<4",
    "sphinx-copybutton>=0.5.2",
]

# Test toolchain.
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Convenience "everything" extra — installs the full development
# environment. Listed last so the cross-extra references above resolve.
dev = [
    "infl_ens[ml,data,vis,configs,docs,test]",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
# Console-script aliases for the two single CLIs (per AGENTS.md §4 rule 1).
# ``python -m infl_ens.training ...`` and ``python -m infl_ens.data ...``
# continue to work whether or not the package is installed.
infl-ens-train = "infl_ens.training.__main__:main"
infl-ens-data = "infl_ens.data.__main__:main"

[project.urls]
# Fill these in with the actual repo URL once it's public.
# Source = "https://github.com/<owner>/infl_ens"
# Documentation = "https://<owner>.github.io/infl_ens/"
# Issues = "https://github.com/<owner>/infl_ens/issues"


# ---------------------------------------------------------------------------
# Hatchling: src-layout configuration
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
# Ship only the importable package in the wheel.
packages = ["src/infl_ens"]

[tool.hatch.build.targets.sdist]
# Source distributions also include configs, scripts, docs, and the
# repo-level invariants so downstream users can reproduce a full run.
include = [
    "/src",
    "/configs",
    "/scripts",
    "/docs",
    "/tests",
    "/README.md",
    "/structure.md",
    "/AGENTS.md",
    "/pyproject.toml",
]


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Make ``src/`` importable so the tests don't need an editable install.
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:transformers.*",
]


# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]
extend-exclude = ["docs/_build", "data", "results"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length — handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files exist to re-export; star/unused imports are expected.
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["infl_ens"]


# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/infl_ens"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
# Heavy optional deps don't ship type stubs; treat them as ``Any``.
ignore_missing_imports = true


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/infl_ens"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
