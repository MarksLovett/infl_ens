# 20-round version of safety_truth_n4_r10_strategic_long.yaml. Doubles the
# closed-loop length to test whether the strategic-routing (2, 2) basin is
# stable under additional rounds of SFT, and whether the specialisation
# margin keeps climbing or saturates.
#
# All other settings (routing rule, batch sizes, SFT epochs, learning
# rate) are identical to the 10-round run so the only varying factor is
# round count.

task: closed_loop
seed: 0
output_dir: results/safety_truth_n4_r20_strategic_long
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000

trait_space:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  n_grid: 32
  kde_bandwidth: 0.08
  threshold: 0.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  n_rounds: 20          # was 10
  batch_size: 512
  blend: 0.5
  routing_weight: G_times_1mG
  save_per_round: true
  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/safety_truth_n4_r20_strategic_long/agents
    max_seq_length: 1024
    per_device_batch_size: 16
    gradient_accumulation_steps: 2
    num_train_epochs: 3.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    seed: 0
