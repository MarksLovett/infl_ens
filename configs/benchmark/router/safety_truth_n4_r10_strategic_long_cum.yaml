# Cumulative-LoRA variant of safety_truth_n4_r10_strategic_long.yaml.
#
# Unlike the original framework where each round trains a fresh LoRA on
# top of the clean base model and any prior specialisation is discarded,
# this config sets `cumulative_lora: true` so each round loads the
# previous round's adapter and continues training from it. The agent's
# capability therefore *accumulates* across rounds rather than resetting.
#
# Saves to its own output_dir so the original (independent-round) run is
# untouched. Compare the two by running both and aggregating the probe
# results.
#
# Diagnostic to watch on the capability probe (Tier 3): under cumulative
# training the specialisation margin should grow substantially faster
# than the independent-round version, possibly toward 0.20-0.40 instead
# of saturating around 0.13. Catastrophic forgetting (diagonal NLL stops
# falling while off-diagonal rises) is a real risk; the probe is the
# detector.

task: closed_loop
seed: 0
output_dir: results/safety_truth_n4_r10_strategic_long_cum
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  n_grid: 32
  kde_bandwidth: 0.08
  threshold: 0.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  n_rounds: 10
  batch_size: 512
  blend: 0.5
  routing_weight: G_times_1mG
  save_per_round: true
  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/safety_truth_n4_r10_strategic_long_cum/agents
    max_seq_length: 1024
    per_device_batch_size: 16
    gradient_accumulation_steps: 2
    num_train_epochs: 3.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    # The new flag: load each agent's prior adapter and continue
    # training it across rounds instead of starting fresh.
    cumulative_lora: true
    seed: 0
