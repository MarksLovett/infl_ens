# Matched pooled-generalist replay for the seven-axis soft-pair specialists.
#
# The training prompts and responses are reconstructed verbatim from the
# specialist run's history. Because that arm uses dense soft routing, the
# replay de-duplicates each round back to the underlying routed minibatch:
# the pooled LoRA therefore sees each source example once, rather than once
# per pair. It provides the data-matched generalist comparator.

task: baseline_replay
seed: 0
history_path: results/seven_axis_soft_pairs/seed0/history.json
output_dir: results/seven_axis_soft_pairs_pooled_replay/seed0

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: jbb_behaviors
    path: data/jbb_behaviors
    include_benign: true
    max_records: null
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: prompt_injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

# Kept identical to the specialist arm so the cached projector is reused.
trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  encoder_batch_size: 32
  cache: true
  cache_dir: data/trait_space_cache
  n_grid: 3
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.35
  mode_alignment_weights:
    jailbreak: 1.0
    privacy: 1.0
    overrefusal: 1.0
    injection: 1.0
    policy_violation: 1.0
  coordinate_stretch_gamma: 1.0

baseline_replay:
  agent_name: pooled-generalist
  save_per_round: true
  rounds: null

sft:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  output_dir: results/seven_axis_soft_pairs_pooled_replay/seed0/agents
  max_seq_length: 1024
  per_device_batch_size: 8
  gradient_accumulation_steps: 2
  num_train_epochs: 1.0
  learning_rate: 2.0e-4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  cumulative_lora: true
  seed: 0
