# Decoupled-reweight variant of the loss_reweight family. Combines:
#
#   1. Canonical routing  (routing_weight: G)
#   2. UNIT-WEIGHT SFT loss  (loss_reweight: position_only -> sample_weights=None)
#   3. (1-G)-weighted CENTROID for the position update  (loss_reweight:
#      position_only -> eval_weights are the (1-G) weights)
#   4. Cumulative LoRA  (each round loads and continues the prior adapter)
#
# Mathematical motivation: under canonical routing p_i = G_i, the
# expected centroid drift is
#
#     E[Δ x_i]  ∝  Σ_b B(b) G_i(b) w(b) (b - x_i) / Σ_b B(b) G_i(b) w(b)
#
# Setting w(b) = 1 - G_i(b) makes the integrand exactly Σ_b B(b)
# G_i(1-G_i)(b - x_i), i.e. ∇_{x_i} u_i up to the constant Σ metric.
# Crucially this only requires the (1-G) weighting on the CENTROID
# computation — the SFT loss can run at unit weight and still produce
# a gradient-matched position drift. Decoupling the two recovers the
# full effective sample size lost under 'one_minus_G' (where weight ≈ 0
# on stronghold queries) while keeping the trait-space update exact.
#
# Expected differences from safety_truth_n4_r10_loss_reweight_cum.yaml
# at matched seed/sigma:
# - Trait-space trajectory should converge to the same Nash points
#   (centroid weighting matches).
# - Per-round SFT loss should be LOWER (unit-weight CE on the full
#   canonical-routed corpus, no near-zero weights diluting the loss).
# - Tier 3a/3b diagonal NLL should be lower (the LoRA gets full gradient
#   signal from stronghold queries; capability on own niche should be
#   deeper).
# - Specialisation margin μ(r) should be larger (sharper niche capability
#   plus same trait-space drift).
#
# Compared to safety_truth_n4_r10_strategic_long_cum.yaml at matched
# budget: gradient direction is exact rather than approximate (no 1/Z(b)
# bias). LoRA training distribution is the canonical-routed corpus
# (broader than strategic's contested-only corpus); the agent fully
# trains on its own strongholds rather than seeing only boundaries
# between niches.
#
# Writes to results/safety_truth_n4_r10_position_only_cum/ so the
# loss_reweight_cum (full reweight) and strategic_long_cum runs at the
# same n_rounds/sigma stay intact for A/B comparison.

task: closed_loop
seed: 0
output_dir: results/safety_truth_n4_r10_position_only_cum
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000

trait_space:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  n_grid: 32
  kde_bandwidth: 0.08
  threshold: 0.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  n_rounds: 10
  batch_size: 256
  blend: 0.5
  # Position centroid: batch (routed minibatch) or expected_pool (full-corpus
  # G(1-G) limit; removes batch variance from position updates).
  # centroid_mode: expected_pool
  # init_mode: mean_noise | pairs_near_theory | theory_gradient
  # theory_gradient: GA Nash from random separated start → SFT init at theory_end
  # init_mode: theory_gradient
  # init_noise: 0.0
  # theory_gradient:
  #   learning_rate: 5.0e-3
  #   n_steps: 5000
  #   min_pairwise: 0.2
  # Adaptive position EMA (see infl_ens.utils.position_step). Run
  # scripts/run_position_step_stability_test.sh at sigma 0.25/0.75 before
  # large sweeps; then set mode/step_cap from the winner.
  # position_step:
  #   mode: cap_linf      # static | cap_linf | cap_l2 | trust_box
  #   step_cap: 0.05      # max L∞ (or L2) move per round toward centroid
  #   blend_max: 0.5      # optional ceiling (defaults to blend above)
  # Break exact clone symmetry at the resource mean (see closed_loop_demo).
  init_noise: 1.0e-4
  # Canonical routing — each agent receives queries proportional to G_i,
  # so the agent's training distribution covers its niche at full mass.
  routing_weight: G
  # New mode: (1-G) factor applied ONLY to the centroid (eval_weights),
  # NOT to the SFT loss (sample_weights). Trait-space drift matches
  # ∇_{x_i} u_i exactly; LoRA loss has full effective sample size.
  loss_reweight: position_only
  # Persist a separate LoRA adapter per (agent, round) for the
  # capability probe.
  save_per_round: true
  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/safety_truth_n4_r10_position_only_cum/agents
    max_seq_length: 1024
    per_device_batch_size: 8
    gradient_accumulation_steps: 2
    num_train_epochs: 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    cumulative_lora: true
    seed: 0
