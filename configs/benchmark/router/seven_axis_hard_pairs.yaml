# Seven-axis stochastic hard routing over co-located theory pairs.
#
# This arm is matched to ``seven_axis_soft_pairs.yaml`` in its data split,
# model, paired-theory initialization, LoRA settings, and round schedule. Its
# only algorithmic change is routing: every source prompt is sampled once from
# the clone-level proportional allocation :math:`G`. The two co-located clones
# in a pair share one LoRA, so pair batches are the union of their sampled
# prompts and every source prompt trains exactly one specialist adapter.
#
# The accompanying pooled replay consumes the union of all hard-routed batches
# each round, recovering the full source batch once for the generalist.

task: closed_loop
seed: 0
output_dir: results/seven_axis_hard_pairs/seed0
policy: proportional

data_split:
  seed: 0
  train_frac: 0.7
  val_frac: 0.1
  test_frac: 0.2
  manifest: data/splits/seven_axis_soft_seed0.json
  cover_train_exactly: true
  target_n_rounds: 12
  preferred_batch_sizes: [4900, 2450, 1225, 980, 700, 350]
  min_rounds: 5
  max_rounds: 50

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: jbb_behaviors
    path: data/jbb_behaviors
    include_benign: true
    max_records: null
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: prompt_injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  encoder_batch_size: 32
  cache: true
  cache_dir: data/trait_space_cache
  n_grid: 3
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.35
  mode_alignment_weights:
    jailbreak: 1.0
    privacy: 1.0
    overrefusal: 1.0
    injection: 1.0
    policy_violation: 1.0
  coordinate_stretch_gamma: 1.0

agents:
  pairs_from_axes: true
  name_prefix: clone

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  init_mode: theory_gradient_paired
  init_noise: 0.0
  theory_gradient:
    learning_rate: 2.0e-2
    n_steps: 8000
    tol: 1.0e-8
    min_pairwise: 0.2
    pairing: nearest
  snap_collapsed_pairs: true
  collapse_merge_threshold: 0.01

  # Exactly one categorical G draw per prompt. A pair's LoRA receives the
  # union of draws to its two co-located clones.
  routing_mode: hard
  routing_weight: G
  loss_reweight: null
  # Pinned to the historical unweighted centroid this arm was recorded
  # with. The default is now `theory_matched` ((1-G)-weighted centroid).
  position_update: naive
  centroid_mode: batch
  blend: 0.5

  sft_merge_groups: from_init
  merge_group_prefix: pair
  save_per_round: true

  val_eval:
    every_n_rounds: 5
    max_eval_records: null
    agents: null

  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/seven_axis_hard_pairs/seed0/agents
    max_seq_length: 1024
    per_device_batch_size: 8
    gradient_accumulation_steps: 2
    num_train_epochs: 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    cumulative_lora: true
    seed: 0
