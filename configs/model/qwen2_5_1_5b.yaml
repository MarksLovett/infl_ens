# configs/model/qwen2_5_1_5b.yaml
# Shared base-model settings consumed by the SFT trainer.

base_model: Qwen/Qwen2.5-1.5B-Instruct
max_seq_length: 1024
per_device_batch_size: 8
gradient_accumulation_steps: 2
num_train_epochs: 1.0
learning_rate: 2.0e-4

# LoRA hyperparameters tuned for the Qwen2.5 family.
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# A40 supports bf16; flip to false to force fp16 on older GPUs.
bf16: true
gradient_checkpointing: true
