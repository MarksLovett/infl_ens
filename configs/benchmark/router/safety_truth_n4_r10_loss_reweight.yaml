# Same training landscape as safety_truth_n4_r10_strategic.yaml but uses
# the canonical proportional allocation p_i = G_i for *routing* and adds
# the per-query SFT loss weight w_m = 1 - G_i(x, b_m) for queries routed
# to agent i. In expectation this matches the strategic gradient
# *exactly* (up to the constant Sigma metric) — not just to leading
# order as routing_weight='G_times_1mG' does — so it is the cleanest
# gradient-aligned closed loop available.
#
# The trade-off is variance: queries from traits where the routed agent
# already dominates (G_i ≈ 1) carry weight ≈ 0 and contribute almost
# nothing to the SFT step. The effective sample size for those agents
# shrinks compared to the strategic-routing run, and this is the
# variance that Tier 1 of scripts/probe_sft_capability.py picks up.
# A divergence between this run and safety_truth_n4_r10_strategic.yaml
# at matched seed/sigma localises the difference between "approximate
# gradient match with unit weights" (strategic) and "exact gradient
# match with reweighted updates" (this config).
#
# See scripts/compare_reweighted_drift.py for the offline numerical
# alignment check that motivated this config, and the closed_loop knob
# matrix in src/infl_ens/training/__init__.py for the four
# routing × loss combinations and which are gradient-matched.

task: closed_loop
seed: 0
output_dir: results/safety_truth_n4_r10_loss_reweight
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000

trait_space:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  n_grid: 32
  kde_bandwidth: 0.08
  threshold: 0.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  n_rounds: 10
  batch_size: 256
  blend: 0.5
  # Canonical routing — keeps the game's natural assignment counts
  # (an agent that owns G_i of trait b receives that fraction of the
  # queries from b). The reweighting fixes gradient alignment without
  # changing the routing.
  routing_weight: G
  # Per-query SFT loss weight w_m = 1 - G_i(x, b_m). Combined with
  # routing_weight: G above, the expected position drift is exactly
  # proportional to ∇_{x_i} u_i (see compare_reweighted_drift.py).
  # The combination loss_reweight=one_minus_G + routing_weight=G_times_1mG
  # is rejected at startup (_validate_routing_and_loss_modes in
  # training/__main__.py) because it double-counts the (1-G) factor.
  loss_reweight: one_minus_G
  # Persist a separate LoRA adapter per (agent, round) under
  # results/safety_truth_n4_r10_loss_reweight/agents/<clone>/round-NN.
  # Required for scripts/probe_sft_capability.py.
  save_per_round: true
  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/safety_truth_n4_r10_loss_reweight/agents
    max_seq_length: 1024
    per_device_batch_size: 8
    gradient_accumulation_steps: 2
    num_train_epochs: 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    seed: 0
