# Training from the theory equilibrium, seed 0.
#
# One factor moves against seven_axis_8pair_sigma05/seed0: where the
# clones start. Everything else -- split, absolute sigma, twelve rounds,
# fully dense soft routing, loss weighting -- is identical, so the two
# arms share a test pool and the existing seed-0 generalist is still
# data-matched and is NOT retrained.
#
# The positions below are an equilibrium of the influencer game solved
# against the empirical prompt cloud (28355 prompts, uniform
# weight) rather than against the lattice KDE. That solve is CPU-only;
# see paper/true_theory_positions.py. Pinning the result here keeps it
# in the resolved config instead of being recomputed per run.
#
#   sigma (absolute)      0.206020
#   sigma_0* lattice      0.412040   (what the runs quote against)
#   sigma_0* empirical    0.371098
#   pairs                 8  (16 clones, co-located)
#   grad-norm at start    2.246e-09   (polished from 7.090e-03 in 115 fixed-point iterations)

includes:
  - _closed_loop_base.yaml

output_dir: results/seven_axis_theory_eq_8pair/seed0

sigma_fraction: 0.50

# An explicit list replaces the base's `agents: {pairs_from_axes: true}`
# mapping, which always expands to N = 2L = 14 regardless of pair count.
# This arm needs N = 16, one clone pair per routing pair.
agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3
  - name: clone-4
  - name: clone-5
  - name: clone-6
  - name: clone-7
  - name: clone-8
  - name: clone-9
  - name: clone-10
  - name: clone-11
  - name: clone-12
  - name: clone-13
  - name: clone-14
  - name: clone-15

closed_loop:
  routing_mode: soft
  soft_top_k: 8                     # == number of pairs: fully dense
  soft_loss: weighted
  init_mode: given
  init_noise: 0.0
  init_positions_source: >-
    influencer-game equilibrium under the empirical prompt measure,
    solved offline from seven_axis_8pair_sigma05/seed0 settings

  # Clone 2i and 2i+1 share pair i's position. Co-location is a fixed
  # point of the update, so the pairs stay merged without being forced.
  init_positions:
    clone-0: [0.3794358029, 0.1828078630, 0.4380301154, 0.1578983746, 0.1449262217, 0.8309987591, 0.3329524668]
    clone-1: [0.3794358029, 0.1828078630, 0.4380301154, 0.1578983746, 0.1449262217, 0.8309987591, 0.3329524668]
