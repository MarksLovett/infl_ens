# ARM 1 of 3 — seven-axis SOFT routing over co-located theory pairs, top-k = 3.
#
# Specialist arm. 2L = 14 clones start at L = 7 co-located grid-Nash positions
# (`theory_gradient_paired`); `sft_merge_groups: from_init` gives one cumulative
# LoRA per pair (pair-0 .. pair-6, harm order). Each prompt is routed softly to
# its `soft_top_k: 3` highest-share PAIRS, which train on it with the pair share
# as the per-example loss weight (the "distributed learning" signal).
#
# Position update: `theory_matched` (the default) — mandatory here because the
# run starts from a theory initialization, so the trait-space dynamics must stay
# the game's gradient flow. Every CLONE steps toward the G_i(1-G_i)-weighted
# centroid of the WHOLE batch, independent of soft_top_k and of the merge
# groups. Nothing ties partners together: co-located clones have identical
# shares and therefore take identical steps, so the theory's stable pairs
# persist on their own. The within-pair L2 logged in `agent_geometry` each round
# is the audit of that claim (it must stay ~0).
#
# Matched to ARM 2 (seven_axis_hard_pairs_matched.yaml) in EVERYTHING except
# routing: same manifest, seed, init, sigma, LoRA settings and 12-round
# schedule. Identical seed + manifest + init means the two arms draw the same
# round batches, so ONE pooled generalist replay (ARM 3) is data-matched to
# both. `scripts/run_seven_axis_3arm_analysis.sh` verifies that before using it.
#
# The `benchmarks:` and `trait_space:` blocks are copied verbatim from
# seven_axis_soft_pairs.yaml so the trait-space cache fingerprint
# (3b42c68a8dd334c5, Qwen3-Embedding-8B-AWQ) is reused. DO NOT EDIT THEM —
# any value change forces a multi-hour re-encode of the 28k-prompt corpus.
#
# Launch:
#   ARM=seven_axis_soft_topk3_pairs GPU=0 \
#   CONFIG=configs/benchmark/router/seven_axis_soft_topk3_pairs.yaml \
#   REMOTE=mslovett@doob.dartmouth.edu bash scripts/run_soft_pairs_on_doob.sh

task: closed_loop
seed: 0
output_dir: results/seven_axis_soft_topk3_pairs/seed0
policy: proportional

data_split:
  seed: 0
  train_frac: 0.7
  val_frac: 0.1
  test_frac: 0.2
  # Shared with ARM 2 and ARM 3: the partitions and the per-round batch
  # schedule must be identical across arms for the comparison to be fair.
  manifest: data/splits/seven_axis_soft_seed0.json
  cover_train_exactly: true
  target_n_rounds: 12
  preferred_batch_sizes: [4900, 2450, 1225, 980, 700, 350]
  min_rounds: 5
  max_rounds: 50

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: jbb_behaviors
    path: data/jbb_behaviors
    include_benign: true
    max_records: null
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: prompt_injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  encoder_batch_size: 32
  cache: true
  cache_dir: data/trait_space_cache
  n_grid: 3
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.35
  mode_alignment_weights:
    jailbreak: 1.0
    privacy: 1.0
    overrefusal: 1.0
    injection: 1.0
    policy_violation: 1.0
  coordinate_stretch_gamma: 1.0

# Two clones per trait axis: N = 2L = 14 -> clone-0 .. clone-13.
agents:
  pairs_from_axes: true
  name_prefix: clone

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  # Theory initialization: grid-Nash gradient ascent, paired refinement,
  # exact co-location. This is what makes `position_update: theory_matched`
  # mandatory below — the run starts on the theory manifold.
  init_mode: theory_gradient_paired
  init_noise: 0.0
  theory_gradient:
    learning_rate: 2.0e-2
    n_steps: 8000
    tol: 1.0e-8
    min_pairwise: 0.2
    pairing: nearest
  snap_collapsed_pairs: true
  collapse_merge_threshold: 0.01

  routing_mode: soft
  soft_top_k: 3          # each prompt trains its 3 highest-share pairs
  soft_loss: weighted    # pair share as the per-example loss weight
  routing_weight: G
  loss_reweight: null
  position_update: theory_matched   # per-clone dense G(1-G) batch centroid
  centroid_mode: batch
  blend: 0.5

  sft_merge_groups: from_init
  merge_group_prefix: pair
  # Required: the per-round NLL table (rounds 4..last) scores the archived
  # per-round adapters after training.
  save_per_round: true

  # Off during training; the per-round val curve is produced post-hoc over the
  # archived adapters, which is cheaper and lets us pick the exact rounds.
  val_eval:
    every_n_rounds: 0

  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/seven_axis_soft_topk3_pairs/seed0/agents
    max_seq_length: 1024
    per_device_batch_size: 8
    gradient_accumulation_steps: 2
    num_train_epochs: 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    cumulative_lora: true
    seed: 0

# Final-round held-out NLL, run automatically when training finishes.
# The per-round (rounds 4..last) val curve is a separate invocation:
#   python -m infl_ens.evaluation --config <this file> -- \
#       eval.partitions='["val"]' eval.rounds='[4,5,6,7,8,9,10,11]'
eval:
  partitions: [train, test]
  rounds: final
  agents: null             # discovers agents/pair-*/round-NN
  max_eval_records: 1000   # per benchmark
  forward_batch_size: 8
  max_seq_length: null     # defaults to closed_loop.sft.max_seq_length
  after_training: true
  baseline_run_dir: null   # generalist is scored by its own arm (ARM 3)
