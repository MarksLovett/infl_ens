# Training from the theory equilibrium, seed 0.
#
# One factor moves against seven_axis_2pair_sigma05/seed0: where the
# clones start. Everything else -- split, absolute sigma, twelve rounds,
# fully dense soft routing, loss weighting -- is identical, so the two
# arms share a test pool and the existing seed-0 generalist is still
# data-matched and is NOT retrained.
#
# The positions below are an equilibrium of the influencer game solved
# against the empirical prompt cloud (28355 prompts, uniform
# weight) rather than against the lattice KDE. That solve is CPU-only;
# see paper/true_theory_positions.py. Pinning the result here keeps it
# in the resolved config instead of being recomputed per run.
#
#   sigma (absolute)      0.174119
#   sigma_0* lattice      0.348237   (what the runs quote against)
#   sigma_0* empirical    0.313635
#   pairs                 2  (4 clones, co-located)
#   grad-norm at start    2.600e-08   (polished from 4.487e-05 in 55 fixed-point iterations)

includes:
  - _closed_loop_base.yaml

output_dir: results/seven_axis_theory_eq_2pair/seed0

sigma_fraction: 0.50

# An explicit list replaces the base's `agents: {pairs_from_axes: true}`
# mapping, which always expands to N = 2L = 14 regardless of pair count.
# This arm needs N = 4, one clone pair per routing pair.
agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3

closed_loop:
  routing_mode: soft
  soft_top_k: 2                     # == number of pairs: fully dense
  soft_loss: weighted
  init_mode: given
  init_noise: 0.0
  init_positions_source: >-
    influencer-game equilibrium under the empirical prompt measure,
    solved offline from seven_axis_2pair_sigma05/seed0 settings

  # Clone 2i and 2i+1 share pair i's position. Co-location is a fixed
  # point of the update, so the pairs stay merged without being forced.
  init_positions:
    clone-0: [0.4230345192, 0.3577525027, 0.4469270109, 0.2718969558, 0.3151000510, 0.4421685588, 0.5167281344]
    clone-1: [0.4230345192, 0.3577525027, 0.4469270109, 0.2718969558, 0.3151000510, 0.4421685588, 0.5167281344]
    clone-2: [0.5409272887, 0.6062699999, 0.5339622360, 0.6598375309, 0.6344395310, 0.5349447184, 0.4839281367]
    clone-3: [0.5409272887, 0.6062699999, 0.5339622360, 0.6598375309, 0.6344395310, 0.5349447184, 0.4839281367]

  # Pinned to match the co-location above, since no solve runs to infer it.
  sft_merge_groups:
    - train_as: pair-0
      names: [clone-0, clone-1]
    - train_as: pair-1
      names: [clone-2, clone-3]
