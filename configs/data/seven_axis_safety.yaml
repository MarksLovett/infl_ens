# Seven safety benchmarks, one trait axis each, plus the 70/10/20 split.
#
# The `benchmarks` list is hashed into the trait-space cache fingerprint
# together with `trait_space`; keep order and values stable.
benchmarks:
  - kind: beavertails            # harm
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval               # hallucination
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: jbb_behaviors          # jailbreak
    path: data/jbb_behaviors
    include_benign: true
    max_records: null
  - kind: ai4privacy             # privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench                # over-refusal
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: prompt_injection       # injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer          # policy violation
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

# Shared by every arm of an experiment: identical partitions and per-round
# batch schedule are what make the arms data-matched.
data_split:
  seed: 0
  train_frac: 0.7
  val_frac: 0.1
  test_frac: 0.2
  manifest: data/splits/seven_axis_soft_seed0.json
  cover_train_exactly: true
  target_n_rounds: 12
  preferred_batch_sizes: [4900, 2450, 1225, 980, 700, 350]
  min_rounds: 5
  max_rounds: 50
