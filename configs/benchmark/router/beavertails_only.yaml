# configs/benchmark/router/beavertails_only.yaml
# Single-axis ablation: BeaverTails harm axis only (1-D trait space).
# Useful to confirm that the bifurcation cascade reproduces in 1-D with a
# real benchmark, matching the analytical results in §3 of the paper.

task: router_training
seed: 0
output_dir: results/beavertails_only

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  n_grid: 64
  kde_bandwidth: null
  threshold: 0.5

agents:
  - name: agent-0
  - name: agent-1
  - name: agent-2

sigma_mode: stability_fraction
sigma_fraction: 0.5

training:
  learning_rate: 5.0e-3
  n_steps: 5000
  tol: 1.0e-8
  clip_to_box: true
