name: docs

# Build the Sphinx site on every push to ``main`` (and on manual
# dispatch) and publish it to GitHub Pages via the modern Pages
# deployment API (``actions/upload-pages-artifact`` +
# ``actions/deploy-pages``). No ``gh-pages`` branch needed.
#
# Required one-time repository setup:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "infl_ens/**"
      - "docs/**"
      - "README.md"
      - "structure.md"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; in-progress builds finish so we don't
# publish a half-rendered site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Show repo layout (diagnostic)
        # Helps debug "ModuleNotFoundError: No module named 'infl_ens'"
        # by surfacing the actual on-disk layout the doc build sees.
        run: |
          echo "::group::Top-level"
          ls -la
          echo "::endgroup::"
          echo "::group::src/ (if present)"
          [ -d src ] && find src -maxdepth 3 -type d | sort || echo "no src/ directory"
          echo "::endgroup::"
          echo "::group::infl_ens/ at repo root (if present)"
          [ -d infl_ens ] && find infl_ens -maxdepth 3 -type d | sort || echo "no flat infl_ens/ directory"
          echo "::endgroup::"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Install the package (if pyproject.toml or setup.py exists)
        # Belt-and-suspenders: if the repo is pip-installable, do it so
        # autodoc can find ``infl_ens`` regardless of layout quirks.
        # If neither file exists this step is a no-op.
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "Installing package in editable mode..."
            pip install -e . || echo "::warning::editable install failed; falling back to PYTHONPATH"
          else
            echo "No pyproject.toml / setup.py; relying on PYTHONPATH + conf.py sys.path."
          fi

      - name: Build HTML
        # ``-W --keep-going`` turns warnings into errors but still runs
        # through to surface every problem in one go. Loosen if the
        # repo intentionally ships warnings.
        # ``PYTHONPATH`` is set as a belt-and-suspenders backup to the
        # ``sys.path`` insertion done in ``docs/conf.py``.
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: |
          sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Disable Jekyll on Pages
        # Without ``.nojekyll`` GitHub Pages skips files/directories
        # whose names start with an underscore (``_static``,
        # ``_sources``, ...), which breaks Sphinx output.
        run: touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
