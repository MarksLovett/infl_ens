# Evaluate one saved LoRA adapter on BeaverTails and HaluEval.
#
#   python -m infl_ens.evaluation --config configs/evaluation/adapter_on_benchmarks.yaml \
#       -- adapter_dir=results/<run>/agents/clone-0

task: adapter_eval
seed: 0
output_dir: results/eval_adapter_smoke
base_model: Qwen/Qwen2.5-1.5B-Instruct
adapter_dir: results/CHANGE_ME/agents/clone-0

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: null
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: null

eval:
  max_seq_length: 1024
  forward_batch_size: 8
  max_eval_records: 256   # subsample per benchmark for faster smoke runs; null = full split
