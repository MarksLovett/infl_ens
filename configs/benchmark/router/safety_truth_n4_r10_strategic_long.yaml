# Same routing dynamics (G(1-G) strategic routing) and same trait-space
# setup as safety_truth_n4_r10_strategic.yaml, but pushes the SFT side
# harder:
#
#   - num_train_epochs:           1.0  →  3.0   (3× more passes per round)
#   - batch_size:                 256  →  512   (each agent gets ~128 prompts/round)
#   - per_device_batch_size:        8  →   16   (fewer micro-batches per epoch)
#   - logging_steps:                1  ← fine-grained loss capture so
#                                       probe_sft_capability.py Tier 1
#                                       panel actually populates
#
# Net effect: ~6× the optimiser steps per agent per round. Use the
# capability probe as the overfitting detector — if the diagonal NLL keeps
# dropping while off-diagonal stays flat or rises, the model is
# memorising; if both fall together with the specialisation margin holding
# above ~0.05, you have healthy capability differentiation.

task: closed_loop
seed: 0
output_dir: results/safety_truth_n4_r10_strategic_long
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000

trait_space:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  n_grid: 32
  kde_bandwidth: 0.08
  threshold: 0.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  n_rounds: 10
  batch_size: 512          # was 256
  blend: 0.5
  routing_weight: G_times_1mG
  save_per_round: true
  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/safety_truth_n4_r10_strategic_long/agents
    max_seq_length: 1024
    per_device_batch_size: 16   # was 8
    gradient_accumulation_steps: 2
    num_train_epochs: 3.0       # was 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1            # was 10
    seed: 0
