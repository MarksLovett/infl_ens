# Same training landscape as safety_truth_n4_r10_kde008.yaml but uses the
# strategic per-trait routing weight G_i * (1 - G_i) instead of the canonical
# proportional weight G_i. In expectation, this matches the strategic
# gradient that train_router_positions follows (allocation.utility_gradient),
# so SFT-driven capability drift should track theory's (2, 2) prediction
# rather than landing in (2, 1, 1) / (3, 1) as the canonical run does.
#
# Compare against safety_truth_n4_r10_kde008.yaml at the same seed to
# isolate the routing-weight effect.

task: closed_loop
seed: 0
output_dir: results/safety_truth_n4_r10_strategic
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  n_grid: 32
  kde_bandwidth: 0.08
  threshold: 0.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  n_rounds: 10
  batch_size: 256
  blend: 0.5
  # Routing rule. 'G' = canonical (matches Lovett & Fu 2024 §2). For
  # strategic-gradient correspondence under MV-Gaussian kernels, use
  # 'G_times_1mG': p_i ∝ G_i (1 - G_i), normalised per trait.
  routing_weight: G_times_1mG
  # Persist a separate LoRA adapter per (agent, round) under
  # results/safety_truth_n4_r10_strategic/agents/<clone>/round-NN. Adds
  # ~1 GB of disk for a 4-agent / 10-round run. Required for the
  # capability probe (scripts/probe_sft_capability.py).
  save_per_round: true
  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/safety_truth_n4_r10_strategic/agents
    max_seq_length: 1024
    per_device_batch_size: 8
    gradient_accumulation_steps: 2
    num_train_epochs: 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    seed: 0
