# Replay one generalist LoRA from the routed batches produced by the
# AI4Privacy fixed-theory specialist sweep.
task: baseline_replay
seed: 0
history_path: results/ai4privacy_fixed_theory_specialists_r40/seed0/history.json
output_dir: results/ai4privacy_fixed_theory_generalist_r40/seed0

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000

trait_space:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  n_grid: 24
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true

baseline_replay:
  agent_name: generalist
  save_per_round: true
  rounds: null

sft:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  output_dir: results/ai4privacy_fixed_theory_generalist_r40/seed0/agents
  max_seq_length: 1024
  per_device_batch_size: 16
  gradient_accumulation_steps: 2
  num_train_epochs: 3.0
  learning_rate: 2.0e-4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  cumulative_lora: true
  seed: 0
