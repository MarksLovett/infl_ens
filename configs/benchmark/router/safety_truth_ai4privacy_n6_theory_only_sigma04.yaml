# Theory-only 6-agent AI4Privacy router simulation.
#
# Agents are initialized by a paired theory solve: first solve the 6-agent
# gradient-ascent theory problem, co-locate adjacent harm-sorted pairs, refine
# the paired state, then run position-only expected-pool dynamics without SFT.
task: closed_loop
seed: 0
output_dir: results/ai4privacy_theory_only_n6_sigma04
policy: proportional

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000

trait_space:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  n_grid: 24
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.35
  mode_alignment_weights:
    privacy: 1.0
  coordinate_stretch_gamma: 1.5
  coordinate_stretch_gammas:
    hallucination: 2.5
    privacy: 2.5

agents:
  - name: clone-0
  - name: clone-1
  - name: clone-2
  - name: clone-3
  - name: clone-4
  - name: clone-5

sigma_mode: stability_fraction
sigma_fraction: 0.4

closed_loop:
  n_rounds: 40
  batch_size: 512
  blend: 0.5
  init_noise: 0.0
  init_mode: theory_gradient_paired
  centroid_mode: expected_pool
  routing_weight: G
  loss_reweight: position_only
  theory_gradient:
    learning_rate: 5.0e-3
    n_steps: 5000
    tol: 1.0e-8
    min_pairwise: 0.2
