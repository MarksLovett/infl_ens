# Seven-axis soft routing over co-located theory pairs.
#
# Population comes from the trait space: `agents.pairs_from_axes` expands to
# 2L = 14 clones, and `theory_gradient_paired` runs grid-Nash gradient ascent,
# co-locates each pair at its endpoint, refines, and co-locates again — so the
# run starts at L = 7 shared positions, one per axis.
#
# `sft_merge_groups: from_init` turns those pairs into seven adapters
# (pair-0 .. pair-6, harm order). Under `routing_mode: soft` the PAIR is the
# routing unit: member allocations are summed into a pair share, the top
# `soft_top_k` pairs per query are kept and renormalised, and each pair trains
# its single cumulative LoRA on those queries with the pair share as a
# per-example loss weight. One position step per pair is written back to both
# members, so the adapter's routing position IS the pair position and the
# partners never drift apart.
#
# soft_top_k: 7 == number of pairs, i.e. fully dense routing: every pair
# trains on every prompt, weighted by its share. That is ~7x the SFT volume of
# hard routing, which is why this arm wants the A100.
#
# The `benchmarks:` and `trait_space:` blocks are copied verbatim from
# seven_axis_pair_merge_split.yaml so the trait-space cache fingerprint
# (3b42c68a8dd334c5, Qwen3-Embedding-8B-AWQ) is reused. DO NOT EDIT THEM —
# any value change forces a multi-hour re-encode of the 28k-prompt corpus.
#
# Pipeline:
#   GPU=0 bash scripts/run_soft_pairs_on_doob.sh          # sync + launch
#   ARM=seven_axis_soft_pairs MODE=status bash scripts/run_soft_pairs_on_doob.sh

task: closed_loop
seed: 0
output_dir: results/seven_axis_soft_pairs/seed0
policy: proportional

data_split:
  seed: 0
  train_frac: 0.7
  val_frac: 0.1
  test_frac: 0.2
  # Fresh manifest: data/splits/seven_axis_seed0.json predates both the
  # jbb_behaviors swap and the larger prompt_injection download (it covers
  # 662 of the 5000 records now on disk).
  manifest: data/splits/seven_axis_soft_seed0.json
  cover_train_exactly: true
  target_n_rounds: 12
  preferred_batch_sizes: [4900, 2450, 1225, 980, 700, 350]
  min_rounds: 5
  max_rounds: 50

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: 5000
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: 5000
  - kind: jbb_behaviors
    path: data/jbb_behaviors
    include_benign: true
    max_records: null
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: 5000
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: 5000
  - kind: prompt_injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: 5000

trait_space:
  encoder: drawais/Qwen3-Embedding-8B-AWQ-INT4
  # Throughput only: excluded from the cache fingerprint, so this can be
  # tuned per host without invalidating an existing encode. 32 fits
  # comfortably at max_length=512 on an 80GB card.
  encoder_batch_size: 32
  cache: true
  cache_dir: data/trait_space_cache
  n_grid: 3
  kde_bandwidth: 0.08
  threshold: 0.5
  coordinate_residualize: true
  mode_alignment_weight: 0.35
  mode_alignment_weights:
    jailbreak: 1.0
    privacy: 1.0
    overrefusal: 1.0
    injection: 1.0
    policy_violation: 1.0
  # Stretch disabled. The concave stretch existed to counteract the
  # saturation the old clip-based calibration produced (82-97% of prompt
  # mass pinned to the box faces on four of these axes). The quantile
  # normalizer removes that saturation, so the stretch no longer
  # compensates for anything -- it re-skews otherwise uniform marginals
  # (measured: KS 0.011-0.051 without it, 0.315-0.357 with it).
  # 1.0 is also the code default; kept explicit as a record of the change.
  coordinate_stretch_gamma: 1.0

# Two clones per trait axis: N = 2L = 14 -> clone-0 .. clone-13.
agents:
  pairs_from_axes: true
  name_prefix: clone

sigma_mode: stability_fraction
sigma_fraction: 0.5

closed_loop:
  # Theory steps: grid-Nash gradient ascent, then paired refinement.
  init_mode: theory_gradient_paired
  init_noise: 0.0
  theory_gradient:
    learning_rate: 2.0e-2
    n_steps: 8000
    tol: 1.0e-8
    min_pairwise: 0.2
    # Greedy nearest-neighbour matching. Identical to the historical
    # harm-adjacent rule when the solve leaves well-separated pairs, but it
    # does not mispair clusters whose harm coordinates interleave.
    pairing: nearest
  # Belt and braces: the paired init already co-locates partners exactly.
  snap_collapsed_pairs: true
  collapse_merge_threshold: 0.01

  routing_mode: soft
  soft_top_k: 7          # all pairs; bounded by the number of merge groups
  soft_loss: weighted    # pair share as the per-example loss weight
  routing_weight: G
  loss_reweight: null    # soft routing carries its own per-query weights
  # Pinned to the renormalised-share centroid this arm was recorded with.
  # That centroid is NOT gradient matched (mass ∝ G_p rather than
  # G_p(1-G_p)); the default is now `theory_matched`, see
  # seven_axis_soft_pairs_matched.yaml for the corrected arm.
  position_update: naive
  centroid_mode: batch
  blend: 0.5

  sft_merge_groups: from_init
  merge_group_prefix: pair
  save_per_round: true

  val_eval:
    every_n_rounds: 5
    max_eval_records: null
    agents: null         # discovers agents/pair-*/round-NN

  sft:
    base_model: Qwen/Qwen2.5-1.5B-Instruct
    output_dir: results/seven_axis_soft_pairs/seed0/agents
    max_seq_length: 1024
    per_device_batch_size: 8
    gradient_accumulation_steps: 2
    num_train_epochs: 1.0
    learning_rate: 2.0e-4
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bf16: true
    gradient_checkpointing: true
    logging_steps: 1
    cumulative_lora: true
    seed: 0
