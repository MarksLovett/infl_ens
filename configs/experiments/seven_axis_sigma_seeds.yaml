    - cross_arm_report

smoke:
  tests:
    - tests/test_soft_pairs.py
  arms: [s02_seed1, s045_seed2]
  output_root: results/_smoke_seeds
  overrides:
    data_split: null
    eval: null
    closed_loop.n_rounds: 2
    closed_loop.batch_size: 64
    closed_loop.theory_gradient.n_steps: 500
