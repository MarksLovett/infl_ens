# Final-round adapters only (round 39 of a 40-round run), all agents.
#
#   python -m infl_ens.evaluation --config configs/evaluation/run_final_round.yaml \
#       -- run_dir=results/pairs_near_eq_round_sweep/r40/seed0

task: run_eval
seed: 0
output_dir: results/eval_pairs_near_eq_r40_seed0_final
base_model: Qwen/Qwen2.5-1.5B-Instruct
run_dir: results/pairs_near_eq_round_sweep/r40/seed0

agents: [clone-0, clone-1, clone-2, clone-3]
rounds: [39]

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: null
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: null

eval:
  max_seq_length: 1024
  forward_batch_size: 8
  max_eval_records: 128
