# Evaluate merge-specialists and pooled baseline on all seven safety axes.
#
#   python -m infl_ens.evaluation --config configs/evaluation/six_axis_run_eval.yaml \
#       -- run_dir=results/six_axis_pair_merge_r40/seed0

task: run_eval
seed: 0
output_dir: results/six_axis_pair_merge_r40/seed0/eval_final_round
base_model: Qwen/Qwen2.5-1.5B-Instruct
run_dir: results/six_axis_pair_merge_r40/seed0

agents: null
rounds: [39]

benchmarks:
  - kind: beavertails
    path: data/beavertails/30k_train.jsonl
    max_records: null
  - kind: halueval
    path: data/halueval
    tasks: [qa, dialogue]
    max_records: null
  - kind: toxicchat
    path: data/toxicchat
    score_mode: jailbreaking
    human_annotated_only: false
    max_records: null
  - kind: ai4privacy
    path: data/ai4privacy
    score_mode: density
    english_only: true
    max_records: null
  - kind: orbench
    path: data/orbench
    configs: [or-bench-80k, or-bench-toxic]
    max_records: null
  - kind: prompt_injection
    path: data/prompt_injection
    max_records: 5000
  - kind: do_not_answer
    path: data/do_not_answer
    include_benign: true
    max_records: null

eval:
  max_seq_length: 1024
  forward_batch_size: 8
  max_eval_records: 256
